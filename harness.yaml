# 検査の入口。Node 18 以上だけで動く（npm の部品なし）
typecheck: for f in js/*.js; do node --check "$f" || exit 1; done && for f in worker/*.mjs tools/*.mjs; do node --check "$f" || exit 1; done
offline_smoke: node test/design.check.mjs && node test/build-site.test.mjs && node test/demo-band.test.mjs && node test/sw.test.mjs && node test/worker.test.mjs && node test/sync.test.mjs && node test/sync-client.test.mjs && node test/past.test.mjs && node test/unread.test.mjs && node test/d1-sql.test.mjs && node test/health-paper.test.mjs && node test/backup.test.mjs && node test/auto.test.mjs && node test/auto-worker.test.mjs && node test/ask-link.test.mjs && node test/walkin.test.mjs && node test/walkin-ui.test.mjs && node test/shops.test.mjs && node test/roster.test.mjs && node test/guest.test.mjs && node test/day.test.mjs && node test/share.test.mjs && node test/ai-reader.test.mjs && node test/booking-flow.test.mjs && node test/photo-mask.test.mjs && node test/pass.roundtrip.test.mjs && node test/e2e.test.mjs && node test/guards.test.mjs && node test/match.eval.mjs --check
arch: node test/arch.check.mjs
# 画面を直したとき（手で）: 幅 320 / 375 / 414 / 768 で test/layout.audit.js をブラウザで回す（design.md の「確かめ方」）
contract: (置いたあと・手で) docs/deploy.md の「置いたあとの確かめ」。見本 16 件の読み取りと上限の止まり方を、置いた Worker で確かめる
# 手元の通し: node tools/build-site.mjs && node tools/serve-dist.mjs（dist/ を CSP 付きで配り、/api は見本の AI で Worker を通す）

phase_gate_required: [typecheck, offline_smoke, arch]
phase_gate_optional: []
