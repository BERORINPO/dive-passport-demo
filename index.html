<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDUX 受付 試作</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">

<body>
<!-- REDUX M1-lite（予約前の受付）の試作。客の画面と店の画面を 1 ページで切り替える。
     入力はこのブラウザの中だけに残り、どこにも送らない。答えは店が書いた文だけで、AI は文章を作らない -->
<header class="bar">
  <div class="brand">
    <span class="brand__logo" id="logo" aria-hidden="true"></span>
    <span class="brand__name"><span id="brandName">REDUX</span> <small id="brandSub"></small></span>
  </div>
  <nav class="tabs" role="tablist" aria-label="画面の切り替え">
    <button class="tab" role="tab" id="tab-guest" aria-controls="view-guest" aria-selected="true" type="button"></button>
    <button class="tab" role="tab" id="tab-pass" aria-controls="view-pass" aria-selected="false" type="button" tabindex="-1"></button>
    <button class="tab" role="tab" id="tab-shop" aria-controls="view-shop" aria-selected="false" type="button" tabindex="-1"></button>
    <button class="tab" role="tab" id="tab-booking" aria-controls="view-booking" aria-selected="false" type="button" tabindex="-1"></button>
  </nav>
  <div class="bar__end">
    <button class="demo-switch" id="demoSwitch" type="button" aria-expanded="false" aria-controls="demoNote"></button>
    <button class="lang" id="lang" type="button"></button>
  </div>
</header>

<p class="demo-note" id="demoNote"></p>

<main class="wrap">
  <section class="view view--guest" id="view-guest" role="tabpanel" aria-labelledby="tab-guest">
    <div id="tour"></div>
    <section class="guest-sec" id="chat"></section>
    <div class="guest-sec" id="intake"></div>
    <div id="ask" hidden></div>
  </section>
  <section class="view view--pass" id="view-pass" role="tabpanel" aria-labelledby="tab-pass" hidden>
    <div id="passport"></div>
  </section>
  <section class="view view--desk" id="view-shop" role="tabpanel" aria-labelledby="tab-shop" hidden>
    <div id="shop"></div>
  </section>
  <section class="view view--desk" id="view-booking" role="tabpanel" aria-labelledby="tab-booking" hidden>
    <div id="booking"></div>
  </section>
</main>
